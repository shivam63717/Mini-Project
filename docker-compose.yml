
version: "3.9"
services:
  app:
    build: .
    container_name: mlvision-backend
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
    command: npm start
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mlvision-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data: